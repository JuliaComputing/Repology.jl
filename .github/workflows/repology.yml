name: Export from Repology's DB dump

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  repology-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up git user
        run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1

      - name: Install Julia dependencies
        run: |
            julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Update package components
        id: update
        env:
          REPOLOGY_PROJECT_CHANGES: /tmp/project_changes.md
          REPOLOGY_DATA_OUT: ${{ runner.temp }}/repology_data
        run: |
          julia --project=. scripts/update_repology_info.jl
          if [ -s /tmp/project_changes.md ]; then
            echo "project_changes=true" >> $GITHUB_OUTPUT
          else
            echo "project_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check the corpus against the new data
        id: corpus
        env:
          REPOLOGY_ALLOW_FIXED: 1
          REPOLOGY_DATA: ${{ runner.temp }}/repology_data
        run: |
          if julia --project=. -e 'using Pkg; Pkg.test()'; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          julia --project=. scripts/known_failures.jl

      - name: Publish the new data as a dated release and bind it in Artifacts.toml (if it changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            tag="data-$(date -u +%F)"
            tarball=$(julia --project=. scripts/publish_data.jl "$RUNNER_TEMP/repology_data" "$RUNNER_TEMP/tarballs" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag")
            if [ -n "$tarball" ]; then
              gh release view "$tag" > /dev/null 2>&1 ||
                gh release create "$tag" --latest=false --title "Repology data $(date -u +%F)" \
                  --notes "The \`repology_data\` artifact exported from Repology's database dump by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Artifacts.toml refers to it by URL and hash, so never delete or replace the asset while any version of Repology.jl uses it."
              gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$(basename "$tarball")" ||
                gh release upload "$tag" "$tarball"
            fi

      - name: Commit changes (if any)
        id: git_commit
        run: |
            git add Artifacts.toml test/known_failures.toml
            if git diff --cached --quiet; then
              echo "No changes to commit."
              echo "committed=false" >> $GITHUB_OUTPUT
            else
              git diff --cached -U0 test/known_failures.toml > /tmp/known_failures.diff
              git commit -m "[automatic] update Repology data"
              echo "committed=true" >> $GITHUB_OUTPUT
            fi

      - name: Push to the current branch if the corpus passed and no exported URL changed project
        if: steps.git_commit.outputs.committed == 'true' && steps.corpus.outputs.passed == 'true' && steps.update.outputs.project_changes != 'true'
        run: |
            current_branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            git push origin HEAD:"$current_branch"

      - name: Otherwise propose the refresh as a PR
        if: steps.git_commit.outputs.committed == 'true' && (steps.corpus.outputs.passed != 'true' || steps.update.outputs.project_changes == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOLOGY_DATA: ${{ runner.temp }}/repology_data
        run: |
            # known_failures.toml now accepts the regressions, so anything still failing is a real bug
            julia --project=. -e 'using Pkg; Pkg.test()'
            base="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            REFRESH_BRANCH="automatic/repology-data-refresh-${base//\//-}"
            git push --force origin HEAD:"$REFRESH_BRANCH"
            {
              echo "This Repology data refresh needs review, so it was not pushed to \`$base\`."
              if [ -s /tmp/known_failures.diff ]; then
                echo
                echo "It regressed corpus entries, now recorded in \`test/known_failures.toml\`. Before merging, either fix the regression in \`additional_info.toml\`, correct the entry in \`test/corpus.toml\` if the corpus was wrong and Repology is right, or accept it as a known failure."
                echo
                echo '```diff'
                cat /tmp/known_failures.diff
                echo '```'
              fi
              if [ -s /tmp/project_changes.md ]; then
                echo
                echo "$(($(wc -l < /tmp/project_changes.md) - 2)) previously-exported URLs now map to a different project. Many are Repology renames; where a downstream package has claimed an upstream URL, add a \`url_patterns\` entry for the upstream project in \`additional_info.toml\`."
                echo
                echo "<details><summary>Project changes</summary>"
                echo
                head -n 302 /tmp/project_changes.md
                echo
                echo "</details>"
              fi
              echo
              echo "From $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/pr_body.md
            if [ -n "$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[].number')" ]; then
              gh pr edit "$REFRESH_BRANCH" --body-file /tmp/pr_body.md
            else
              gh pr create --base "$base" --head "$REFRESH_BRANCH" --title "[automatic] Repology data refresh for review" --body-file /tmp/pr_body.md
            fi
